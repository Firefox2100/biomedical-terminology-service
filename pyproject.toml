[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bioterms"
authors = [
  { name="Firefox2100", email="wangyunze16@gmail.com" },
]
description = "Biomedical Terminology Service"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiodataloader~=0.4.3",
    "aiofiles~=25.1.0",
    "ariadne~=1.1.1",
    "argon2-cffi~=25.1.0",
    "asgi-csrf~=0.11",
    "celery~=5.6.3",
    "fastapi~=0.157.0",
    "fastmcp~=4.1.3",
    "fhir.resources~=8.3.0",
    # Transitive via ariadne; remove after ariadne addresses the dependency issues
    "graphql-core>=3.2.5,<3.3",
    "httpx~=0.28.1",
    "itsdangerous~=2.2.0",
    "jinja2~=3.1.6",
    "markdown~=3.11.2",
    # 3.7 requires Python 3.12; retain the newest release compatible with Python 3.11.
    "networkx~=3.6.1",
    "numba~=0.68.0",
    # 2.4+ requires Python 3.12; retain the newest release compatible with Python 3.11.
    "numpy~=2.3.5",
    "owlready2~=0.51",
    "pandas~=3.0.6",
    "pyyaml~=6.0.3",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.16.1",
    "pyroaring~=1.2.0",
    "pytheus~=0.6.1",
    "rich~=15.0.0",
    "sentence-transformers~=6.2.0",
    "transformers~=5.20.2",
    "tqdm~=4.70.1",
    "typer~=0.27.3",
    "uvicorn~=0.54.0",
]
dynamic = [
    "version"
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda12x[ctk]~=14.1.1",
]
test = [
    "asyncpg~=0.32.0",
    "aiosqlite~=0.22.1",
    "datasets~=5.1.0",
    "deepdiff~=9.1.0",
    "elasticsearch[async]>=9.5,<10",
    "locust~=2.46.5",
    "matplotlib~=3.11.2",
    "neo4j~=6.4.1",
    "pgvector~=0.5.1",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pylint~=4.1.3",
    "pymongo~=4.19.0",
    "qdrant-client~=1.19.0",
    "redis~=8.1.0",
    "sentry-sdk[fastapi]~=2.72.0",
    "sqlalchemy~=2.1.5",
    "testcontainers~=4.15.0",
]
pymongo = [
    "pymongo~=4.19.0",
]
elasticsearch = [
    "elasticsearch[async]>=9.5,<10",
]
neo4j = [
    "neo4j~=6.4.1",
]
qdrant = [
    "qdrant-client~=1.19.0",
]
redis = [
    "redis~=8.1.0",
]
sentry = [
    "sentry-sdk[fastapi]~=2.72.0",
]
sql = [
    "sqlalchemy~=2.1.5",
]
postgres = [
    "sqlalchemy~=2.1.5",
    "asyncpg~=0.32.0",
    "pgvector~=0.5.1",
]
all = [
    "asyncpg~=0.32.0",
    "elasticsearch[async]>=9.5,<10",
    "pgvector~=0.5.1",
    "pymongo~=4.19.0",
    "neo4j~=6.4.1",
    "qdrant-client~=1.19.0",
    "redis~=8.1.0",
    "sentry-sdk[fastapi]~=2.72.0",
    "sqlalchemy~=2.1.5",
]

[project.urls]
Homepage = "https://github.com/Firefox2100/biomedical-terminology-service"
Repository = "https://github.com/Firefox2100/biomedical-terminology-service.git"
Issues = "https://github.com/Firefox2100/biomedical-terminology-service/issues"

[project.scripts]
bioterms-cli = "bioterms.cli.cli:main"

[tool.setuptools.dynamic]
version = {attr = "bioterms.__version__"}

[tool.locust]
locustfile = "tests/load_test/users/"

[tool.pytest.ini_options]
testpaths = ["tests"]
