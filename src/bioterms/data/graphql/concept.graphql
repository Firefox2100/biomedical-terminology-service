enum ConceptPrefix {
    ctv3
    ensembl
    go
    gene
    hgnc
    hpo
    loinc
    ncit
    ohdsi
    omim
    ordo
    reactome
    rxnorm
    snomed
    uberon
    uniprot
}

enum ConceptStatus {
    active
    deprecated
    unknown
}

enum PathDirection {
    forward
    reverse
    undirected
}

enum RelationshipType {
    exact
    broad
    narrow
    related
    has_symbol
    annotated_with
    is_a
    part_of
    regulates
    negatively_regulates
    positively_regulates
    replaced_by
    preceded_by
    has_input
    has_output
    ohdsi_relationship
    rxnorm_relationship
}

interface SimilarConcept {
    from: Concept!
    to: Concept!
    score: Float!
}

type ConceptPath {
    length: Int!
    nodes: [Concept!]!
}

interface Concept {
    prefix: ConceptPrefix!
    conceptId: String
    label: String
    status: ConceptStatus!

    similarConcepts(threshold: Float): [SimilarConcept!]!
    pathsTo(
        targetPrefix: ConceptPrefix!
        targetConceptId: String!
        relationship: RelationshipType!
        direction: PathDirection = forward
        maxDepth: Int = 12
    ): [ConceptPath!]!
}

interface OntologyConcept {
    children: [Concept!]!
    parents: [Concept!]!
}

type QueryError {
  code: String!
  message: String!
}

enum SearchMatchType {
    exact
    hybrid
}

enum SearchMatchField {
    conceptId
    label
    synonym
}

type SearchMatch {
    type: SearchMatchType!
    exact: Boolean!
    field: SearchMatchField
    text: String
}

type SearchResult {
    rank: Int!
    concept: Concept!
    match: SearchMatch
}

type SearchPipeline {
    lexical: Boolean!
    vector: Boolean!
    mapped: Boolean!
    reranker: Boolean!
}

type SearchMetadata {
    returned: Int!
    limit: Int!
    durationMs: Float!
    vocabularies: [ConceptPrefix!]!
    pipeline: SearchPipeline!
}

type SearchResponse {
    query: String!
    results: [SearchResult!]!
    meta: SearchMetadata!
}

type Query {
    loadedPrefixes: [ConceptPrefix!]!
    search(
        query: String!
        vocabularies: [ConceptPrefix!]!
        limit: Int = 10
        includeMatchDetails: Boolean = true
    ): SearchResponse!
}
