interface EnsemblConcept implements Concept {
    prefix: ConceptPrefix!
    conceptId: String!
    label: String
    bioType: String
    start: Int
    end: Int
    sequence: String
    version: String
    strand: String
    source: String
    status: ConceptStatus!
    similarConcepts(threshold: Float): [SimilarEnsemblConcept!]!
    pathsTo(targetPrefix: ConceptPrefix!, targetConceptId: String!, relationship: RelationshipType!, direction: PathDirection = forward, maxDepth: Int = 12): [ConceptPath!]!
}

type EnsemblGene implements EnsemblConcept & Concept {
    prefix: ConceptPrefix!
    conceptId: String!
    label: String
    bioType: String
    start: Int
    end: Int
    sequence: String
    version: String
    strand: String
    source: String
    status: ConceptStatus!
    similarConcepts(threshold: Float): [SimilarEnsemblConcept!]!
    pathsTo(targetPrefix: ConceptPrefix!, targetConceptId: String!, relationship: RelationshipType!, direction: PathDirection = forward, maxDepth: Int = 12): [ConceptPath!]!
}

