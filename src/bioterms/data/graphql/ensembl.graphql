type SimilarEnsemblConcept implements SimilarConcept {
    from: EnsemblConcept!
    to: EnsemblConcept!
    score: Float!
}

type EnsemblConceptResponse { error: QueryError, data: EnsemblConcept }
type EnsemblConceptListResponse { error: QueryError, data: [EnsemblConcept] }

type EnsemblQuery {
    ensemblConcept(conceptId: String!): EnsemblConceptResponse
    autoComplete(query: String!, limit: Int): EnsemblConceptListResponse
}

extend type Query { ensembl: EnsemblQuery }
