{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <h1 class="h2 mb-2">Create an API key</h1>

      <p class="text-muted">
        Give your new API key a descriptive name so you can recognise its usage later.
      </p>

      {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('post_new_api_key') }}" class="mt-4">
        <input type="hidden" name="csrftoken" value="{{ request.scope.csrftoken() }}">

        <div class="mb-3">
          <label for="name" class="form-label">Key name</label>
          <input type="text"
                 class="form-control"
                 id="name"
                 name="name"
                 required
                 maxlength="128"
                 autocomplete="off"
                 aria-describedby="key-name-help"
                 value="{{ key_name or '' }}"
                 placeholder="e.g. Research notebook">
          <div id="key-name-help" class="form-text">Use a name that identifies where the key will be stored or used.</div>
        </div>

        <div class="d-flex gap-2">
          <a href="{{ url_for('get_api_keys_page') }}" class="btn btn-outline-secondary">
            Cancel
          </a>
          <button type="submit" class="btn btn-primary">
            Create API Key
          </button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
