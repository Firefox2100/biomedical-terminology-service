{% extends "base.html" %}
{% block content %}

<div class="auth-panel">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 mb-2">Administrator sign in</h1>
        <p class="text-muted mb-4">Manage vocabularies and API access for this service.</p>

        {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
        {% endif %}

        <form method="post" action="{{ request.url_for('post_login_credentials') }}" novalidate>
          {% if csrf_token %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          {% endif %}

          {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
          {% endif %}

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              autocomplete="username"
              required
            >
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>

          <input type="hidden" name="csrftoken" value="{{ request.scope.csrftoken() }}">

          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>
      </div>
    </div>

    <div class="mt-3">
      <a class="small link-muted" href="{{ url_for('list_vocabularies') }}">Back to vocabularies</a>
    </div>
</div>

{% endblock %}
