name: Build Docker Image

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
  release:
    types: [ published ]

jobs:
  push_to_registry:
    name: Build and Push Docker Image to Docker Hub
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract base metadata
        id: meta_base
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: firefox2100/biomedical-terminology-service

      - name: Extract CPU metadata
        id: meta_cpu
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: firefox2100/biomedical-terminology-service
          tags: |
            type=ref,event=branch,suffix=-cpu
            type=ref,event=tag,suffix=-cpu
            type=semver,pattern={{version}}-cpu
            type=raw,value=latest-cpu,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}

      - name: Extract GPU metadata
        id: meta_gpu
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: firefox2100/biomedical-terminology-service
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}
            type=ref,event=branch,suffix=-gpu
            type=ref,event=tag,suffix=-gpu
            type=semver,pattern={{version}}-gpu
            type=raw,value=latest-gpu,enable=${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' }}

      - name: Build and push GPU image
        id: push_gpu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_gpu.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}

      - name: Build and push CPU image
        id: push_cpu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: cpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_cpu.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/firefox2100/biomedical-terminology-service
          subject-digest: ${{ steps.push_gpu.outputs.digest }}
          push-to-registry: true
