name: Code Analysis with SonarQube

permissions:
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
      types: [opened, synchronize, reopened]

jobs:
  analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: term-browser/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      # Failures fail the job; later steps use `if: always()` so reports are still published.
      - name: Run tests with coverage
        run: |
          export PYTHONPATH=./src:$PYTHONPATH
          # `*_checks.py` are the Docker-backed integration checks (testcontainers), which the
          # default local `pytest` run leaves out; the hosted runner has Docker, so include them.
          pytest --continue-on-collection-errors -o python_files="test_*.py *_checks.py" \
            --junitxml=test-results.xml --cov=bioterms --cov-report=xml --cov-report=html

      - name: Run browser tests with coverage
        working-directory: term-browser
        run: |
          npm ci
          npm run test:coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            term-browser/coverage/lcov.info

      - name: Extract Version
        if: always()
        run: |
          VERSION=$(awk -F'"' '/^__version__/ {print $2}' ./src/bioterms/__init__.py)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: SonarQube Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ env.VERSION }}

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: "test-results.xml"
